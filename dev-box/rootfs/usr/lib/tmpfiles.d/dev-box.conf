# dev-box persistent state lives on a single volume mounted at
# /var/lib/dev-box; SSH host keys occupy its ssh subdirectory and are
# linked into /etc/ssh so the stock Fedora sshd units work unchanged.

# State directory. The volume mount point itself must be root-owned first:
# tmpfiles refuses to cross a non-root-owned directory (unsafe path
# transition), which would silently disable every rule below.
d /var/lib/dev-box 0755 root root -
d /var/lib/dev-box/ssh 0755 root root -

# Enforce key permissions on every boot; the volume may carry stale modes
# from older images or manual copies. z only adjusts existing files.
z /var/lib/dev-box/ssh/ssh_host_ed25519_key 0600 root root -
z /var/lib/dev-box/ssh/ssh_host_ed25519_key.pub 0644 root root -
z /var/lib/dev-box/ssh/ssh_host_ecdsa_key 0600 root root -
z /var/lib/dev-box/ssh/ssh_host_ecdsa_key.pub 0644 root root -
z /var/lib/dev-box/ssh/ssh_host_rsa_key 0600 root root -
z /var/lib/dev-box/ssh/ssh_host_rsa_key.pub 0644 root root -

# Expose the volume-backed keys at sshd's default lookup paths
L+ /etc/ssh/ssh_host_ed25519_key - - - - /var/lib/dev-box/ssh/ssh_host_ed25519_key
L+ /etc/ssh/ssh_host_ed25519_key.pub - - - - /var/lib/dev-box/ssh/ssh_host_ed25519_key.pub
L+ /etc/ssh/ssh_host_ecdsa_key - - - - /var/lib/dev-box/ssh/ssh_host_ecdsa_key
L+ /etc/ssh/ssh_host_ecdsa_key.pub - - - - /var/lib/dev-box/ssh/ssh_host_ecdsa_key.pub
L+ /etc/ssh/ssh_host_rsa_key - - - - /var/lib/dev-box/ssh/ssh_host_rsa_key
L+ /etc/ssh/ssh_host_rsa_key.pub - - - - /var/lib/dev-box/ssh/ssh_host_rsa_key.pub
