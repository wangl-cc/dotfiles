# dev-box listens on 2222 to stay clear of the host's sshd (the container
# shares the host network namespace). Reachability is restricted to
# localhost and Tailscale by the host firewall, see
# host/etc/nftables/input-policy.nft.
Port 2222

# Keep only host identity in the persistent dev-box state volume. The rest of
# /etc/ssh always comes from the current image.
HostKey /var/lib/dev-box/ssh/ssh_host_ed25519_key
HostKey /var/lib/dev-box/ssh/ssh_host_ecdsa_key
HostKey /var/lib/dev-box/ssh/ssh_host_rsa_key

# Key-only authentication, declared rather than relying on the account
# password happening to be locked.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Outbound SSH uses the host agent mounted by the Quadlet unit. sshd builds a
# fresh environment for each login session, so declare the socket explicitly.
SetEnv SSH_AUTH_SOCK=/run/ssh-agent.socket
