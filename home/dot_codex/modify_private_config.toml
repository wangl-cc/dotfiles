{{- /* chezmoi:modify-template */ -}}
{{- /* Preserve unmentioned local settings; managed values converge on every apply. */ -}}
{{- $config := fromToml .chezmoi.stdin -}}
{{- $kacheCacheDir := joinPath .chezmoi.homeDir ".cache" "kache" -}}
{{- if eq .chezmoi.os "darwin" -}}
{{- $kacheCacheDir = joinPath .chezmoi.homeDir "Library" "Caches" "kache" -}}
{{- end -}}

{{- /* Replace managed tables wholesale so obsolete settings do not survive. */ -}}
{{- $patch := dict
    "model" "gpt-6-astra"
    "model_reasoning_effort" "high"
    "approval_policy" "on-request"
    "approvals_reviewer" "guardian_subagent"
    "features" (dict
        "js_repl" true
        "memories" true
        "context_management" (dict "experimental_mode" true)
        "multi_agent_v2" (dict
            "enabled" true
            "multi_agent_mode_hint_text" (include ".chezmoitemplates/agents/delegation.md")
        )
    )
    "sandbox_mode" "workspace-write"
    "sandbox_workspace_write" (dict
        "network_access" true
        "writable_roots" (list $kacheCacheDir (joinPath .chezmoi.homeDir ".cache" "uv"))
    )
-}}
{{- range $key, $value := $patch -}}
{{- $config = setValueAtPath (list $key) $value $config -}}
{{- end -}}

{{- /* Desktop settings are managed per key; retain all other desktop preferences. */ -}}
{{- $desktopPatch := dict
    "followUpQueueMode" "queue"
    "reviewDelivery" "detached"
    "preventSleepWhileRunning" true
    "git-commit-instructions" `Choose commit messages style in this order:

1. Follow repository-local commit message instructions when present, such as AGENTS.md, CLAUDE.md, CONTRIBUTING.md, or an explicit user instruction.
2. If the repository has no explicit instructions, inspect the recent commit history and match its established style.
3. If neither local instructions nor recent history establish a style, use Conventional Commits.

Keep the subject concise, imperative. Add a body when it clarifies non-obvious context.
`
    "git-pr-instructions" "Write PR titles as final-quality commit titles, no `[codex]` or similar source markers.\n"
    "git-pull-request-merge-method" "squash"
-}}
{{- range $key, $value := $desktopPatch -}}
{{- $config = setValueAtPath (list "desktop" $key) $value $config -}}
{{- end -}}
{{- $config | toToml -}}
